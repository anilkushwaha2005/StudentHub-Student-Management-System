spring.application.name=studentmanagement
spring.datasource.url=jdbc:mysql://localhost:3306/student_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.port=8080

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.autoconfigure.web=DEBUG
server.error.include-message=always
spring.data.rest.base-path=/api
# Custom form document uploads (maximum 10 MB per file)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
