<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Saved | StudentHub</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f6fb;color:#202343;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{width:min(100%,560px);padding:42px 32px;background:#fff;border:1px solid #e8e9f2;border-radius:22px;box-shadow:0 18px 55px rgba(32,35,67,.09);text-align:center}
    .check{width:76px;height:76px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:#e9fbf1;color:#13834d;font-size:42px;font-weight:700}
    h1{margin:0 0 12px;font-size:clamp(27px,5vw,36px);letter-spacing:-.8px}
    p{margin:0 auto 28px;max-width:390px;color:#747b96;line-height:1.65;font-size:16px}
    a{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border-radius:12px;background:#6558ee;color:#fff;text-decoration:none;font-weight:700}
    a:hover{background:#5145d4}
    .brand{margin-bottom:26px;font-size:24px;font-weight:800}.brand span{color:#6558ee}.tag{font-size:11px;color:#6558ee;margin-left:8px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">🎓 student<span>hub</span><span class="tag">STUDENT</span></div>
    <div class="check" aria-hidden="true">✓</div>
    <h1>Profile saved successfully!</h1>
    <p>Your profile details have been saved. You can return to your StudentHub dashboard whenever you're ready.</p>
    <a href="/?logout=1">Continue to Sign in</a>
  </main>
  <script>
    // Clear browser-side authentication so the next visit requires sign-in.
    try {
      localStorage.removeItem("token");
      localStorage.removeItem("authToken");
      localStorage.removeItem("studenthub_token");
      sessionStorage.clear();
    } catch (e) {}
    const params = new URLSearchParams(window.location.search);
    if (params.get("logout") === "1") {
      window.history.replaceState({}, "", "/");
    }
  </script>
</body>
</html>
